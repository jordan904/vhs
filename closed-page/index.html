<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temporarily Closed | Versatile Home Solutions</title>
    <meta name="description" content="Versatile Home Solutions is temporarily closed. Thank you for your interest." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1a365d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --navy: #1a365d;
        --cedar: #8B5A2B;
        --cream: #FAF8F5;
        --steel: #6B7280;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: 'Source Sans 3', system-ui, -apple-system, sans-serif;
        color: var(--navy);
        background: var(--cream);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        line-height: 1.55;
      }
      main {
        max-width: 560px;
        width: 100%;
        text-align: center;
      }
      .brand {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(1.125rem, 2.2vw, 1.375rem);
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--cedar);
        margin: 0 0 2.5rem;
      }
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 700;
        font-size: clamp(2.25rem, 6vw, 3.5rem);
        line-height: 1.1;
        margin: 0 0 1.25rem;
        color: var(--navy);
      }
      .divider {
        width: 60px;
        height: 3px;
        background: var(--cedar);
        margin: 0 auto 1.5rem;
        border: 0;
      }
      p {
        font-size: clamp(1rem, 1.6vw, 1.125rem);
        color: var(--steel);
        margin: 0 auto 1rem;
        max-width: 44ch;
      }
      p.thanks {
        margin-top: 2rem;
        font-style: italic;
        color: var(--navy);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Versatile Home Solutions</p>
      <h1>Temporarily Closed</h1>
      <hr class="divider" aria-hidden="true" />
      <p>We are not accepting new inquiries at this time.</p>
      <p class="thanks">Thank you for your interest.</p>
    </main>
  </body>
</html>
