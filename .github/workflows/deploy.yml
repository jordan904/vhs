name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble closed-page artifact
        run: |
          mkdir -p dist/public
          cp -r closed-page/. dist/public/
          cp client/public/favicon.svg dist/public/favicon.svg
          cp dist/public/index.html dist/public/404.html
          echo "versatilehomesolutions.ca" > dist/public/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
